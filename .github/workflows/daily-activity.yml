name: Daily Activity Auto-Push

on:
  schedule:
    # Har kuni Toshkent vaqti bilan soat 23:30 da (UTC 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # GitHub UI-dan "Run workflow" orqali sinab ko'rish

permissions:
  contents: write

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Node.js muhitini tayyorlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bugungi push faolligini tekshirish
        id: check_activity
        run: |
          set +e
          node scripts/check-daily-activity.cjs
          STATUS=$?
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          exit 0

      - name: Agar bugun push qilinmagan bo'lsa - Navbatdagi dars/masalani yaratish
        id: publish_topic
        if: steps.check_activity.outputs.status == '10'
        run: |
          node scripts/publish-daily-topic.cjs

      - name: O'zgarishlarni commit va push qilish
        if: steps.check_activity.outputs.status == '10'
        run: |
          git config --global user.name "Komila Zokirova"
          git config --global user.email "zokirovakomila500@gmail.com"
          
          git add .
          git commit -m "${{ steps.publish_topic.outputs.commit_msg || 'feat: add daily frontend learning topic [skip ci]' }}"
          git push origin main
          echo "✅ Muvaffaqiyatli commit va push qilindi!"

      - name: Agar allaqachon push qilingan bo'lsa
        if: steps.check_activity.outputs.status == '0'
        run: |
          echo "🎉 Komila bugun allaqachon o'zi kod push qilgan! Yangi commit kerak emas."
