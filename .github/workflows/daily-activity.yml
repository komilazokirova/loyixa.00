name: Daily Activity Auto-Push

on:
  schedule:
    # Har kuni Toshkent vaqti bilan soat 23:30 da (UTC 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # GitHub UI-dan qo'lda sinash uchun

permissions:
  contents: write

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Branch holatini tekshirish va main ga o'tish
        run: |
          git checkout -B main origin/main

      - name: Node.js muhitini tayyorlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bugungi push faolligini tekshirish
        id: check_activity
        run: |
          set +e
          node scripts/check-daily-activity.cjs
          STATUS=$?
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          exit 0

      - name: Agar bugun push qilinmagan bo'lsa - Navbatdagi dars/masalani yaratish
        id: publish_topic
        if: steps.check_activity.outputs.status == '10'
        run: |
          node scripts/publish-daily-topic.cjs

      - name: O'zgarishlarni commit va push qilish
        if: steps.check_activity.outputs.status == '10'
        run: |
          git config --global user.name "Komila Zokirova"
          git config --global user.email "zokirovakomila500@gmail.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Hech qanday yangi o'zgarish yo'q, commit shart emas."
            exit 0
          fi
          
          COMMIT_MSG="${{ steps.publish_topic.outputs.commit_msg }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="feat: add daily frontend learning topic [skip ci]"
          fi
          
          git commit -m "$COMMIT_MSG"
          
          echo "Push jarayoni boshlanmoqda..."
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main 2> push_err.txt || {
            ERR_MSG=$(cat push_err.txt)
            echo "::error title=Git Push Xatoligi::$ERR_MSG"
            echo "=========================================="
            echo "XATOLIK: $ERR_MSG"
            echo "Agar xatolikda 'Permission denied' yoki '403' bo'lsa, Settings -> Actions -> General -> Workflow permissions bo'limida 'Read and write permissions' yoqilishi shart!"
            echo "=========================================="
            exit 1
          }
          echo "✅ Muvaffaqiyatli commit va push qilindi!"

      - name: Agar allaqachon push qilingan bo'lsa
        if: steps.check_activity.outputs.status == '0'
        run: |
          echo "🎉 Komila bugun allaqachon o'zi kod push qilgan! Yangi commit kerak emas."
