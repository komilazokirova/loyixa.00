name: Daily Activity Auto-Push

on:
  schedule:
    # Har kuni Toshkent vaqti bilan soat 23:30 da (UTC 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # Qo'lda sinash uchun

permissions:
  contents: write

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Node.js muhitini tayyorlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bugungi push faolligini tekshirish
        id: check_activity
        run: |
          set +e
          node scripts/check-daily-activity.cjs
          STATUS=$?
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          exit 0

      - name: Agar bugun push qilinmagan bo'lsa - Navbatdagi dars/masalani yaratish
        id: publish_topic
        if: steps.check_activity.outputs.status == '10'
        run: |
          node scripts/publish-daily-topic.cjs

      - name: O'zgarishlarni commit va push qilish
        if: steps.check_activity.outputs.status == '10'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.publish_topic.outputs.commit_msg || 'feat: add daily frontend learning topic' }}
          commit_user_name: "Komila Zokirova"
          commit_user_email: "zokirovakomila500@gmail.com"
          commit_author: "Komila Zokirova <zokirovakomila500@gmail.com>"
          skip_ci: true

      - name: Agar allaqachon push qilingan bo'lsa
        if: steps.check_activity.outputs.status == '0'
        run: |
          echo "🎉 Komila bugun allaqachon o'zi kod push qilgan! Yangi commit kerak emas."
